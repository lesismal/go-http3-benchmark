# The Rust half of the benchmark: the client every framework is measured
# with, the cloudflare/quiche server, and what the two share. One workspace,
# so that quiche and the BoringSSL it builds are compiled once for both.
[workspace]
resolver = "2"
members = ["benchkit", "benchcli-rust", "frameworks/quiche"]

[workspace.dependencies]
benchkit = { path = "benchkit" }
quiche = "0.30"
mio = { version = "1", features = ["os-poll", "net"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
